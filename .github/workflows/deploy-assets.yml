name: Deploy Assets to WordPress.org

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the changes without committing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy-assets:
    uses: artkrsk/wordpress-plugin-workflows/.github/workflows/deploy-assets.yml@main
    with:
      plugin_slug: 'repeater-tags-for-elementor-acf'
      dry_run: ${{ inputs.dry_run }}
      blueprint_check: true
      # Custom blueprint builder — see the note in test.yml.
      blueprint_check_command: |
        node dev/blueprint/check-keys.js
        node dev/blueprint/build-blueprint.js
        if [ -n "$(git status --porcelain .wordpress-org/blueprints/blueprint.json)" ]; then
          echo "::error::blueprint.json is stale or untracked — regenerate it and commit the result"
          git status --porcelain .wordpress-org/blueprints/blueprint.json
          exit 1
        fi
    secrets:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
