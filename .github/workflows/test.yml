name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Supersede in-flight runs for the same ref so pushes don't pile up on the
# single self-hosted runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: artkrsk/wordpress-plugin-workflows/.github/workflows/test.yml@main
    with:
      zip_budget_mb: '0.5'
      blueprint_check: true
      # This repo's blueprint is genuinely custom (two-file seed composition plus
      # a field-key drift guard), so it keeps its own builder in dev/blueprint/
      # instead of the shared arts-wp module. --porcelain, not
      # `git diff --exit-code`: diff says nothing about an untracked file, so it
      # would wave through a blueprint that was never committed.
      blueprint_check_command: |
        node dev/blueprint/check-keys.js
        node dev/blueprint/build-blueprint.js
        if [ -n "$(git status --porcelain .wordpress-org/blueprints/blueprint.json)" ]; then
          echo "::error::blueprint.json is stale or untracked — regenerate it and commit the result"
          git status --porcelain .wordpress-org/blueprints/blueprint.json
          exit 1
        fi
      integration_suites: '["tests/php/phpunit.xml.dist", "tests/php/phpunit-no-acf.xml.dist", "tests/php/phpunit-no-provider.xml.dist"]'
      wp_env_ports: '8890,8891'
      # coverage: true once a JS test suite exists (repo is public — Codecov is viable)
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
