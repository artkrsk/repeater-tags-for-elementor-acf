name: Release Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    uses: artkrsk/wordpress-plugin-workflows/.github/workflows/release.yml@main
    with:
      node_version: '24'
      php_version: '8.4'
      build_command: 'composer install --prefer-dist --no-progress && pnpm build'
      # Auto-detection walks the repo for any PHP file with a "Plugin Name:"
      # header and "dev" sorts before "src" — it was matching
      # dev/mu-plugins/rt-demo-fixtures.php (a real mu-plugin, so it legitimately
      # carries the same header) before ever reaching the actual plugin file.
      # Pinned explicitly rather than relying on repo-layout accidents.
      plugin_slug: 'repeater-tags-for-elementor-acf'
      main_plugin_file: 'src/wordpress-plugin/repeater-tags-for-elementor-acf.php'
      use_arts_changelog: true
      assets_directory: '.wordpress-org'
      version_files: '["plugin_header", "readme.txt", "package.json"]'
      # wp.org approved the plugin 2026-07-13; SVN secrets are set.
      deploy_to_wordpress: true
    secrets:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
